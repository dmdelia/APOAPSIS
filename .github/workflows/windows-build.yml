name: Build APOAPSIS for Windows

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  export-windows:
    name: Test and export Windows build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export with Godot
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          cache: true

      - name: Headless runtime smoke test
        run: |
          set -o pipefail
          /home/runner/.local/share/godot/godot_executable/Godot_v4.5.1-stable_linux.x86_64             --headless             --path .             --quit-after 180             2>&1 | tee /tmp/apoapsis-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid access|Invalid call|ERROR:" /tmp/apoapsis-smoke.log; then
            echo "Runtime smoke test detected Godot errors."
            exit 1
          fi

      - name: Gameplay flow smoke test
        run: |
          set -o pipefail
          /home/runner/.local/share/godot/godot_executable/Godot_v4.5.1-stable_linux.x86_64             --headless             --path .             --script res://tests/smoke_flow.gd             2>&1 | tee /tmp/apoapsis-flow.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid access|Invalid call|ERROR:" /tmp/apoapsis-flow.log; then
            echo "Gameplay flow test detected Godot errors."
            exit 1
          fi
          grep -q "APOAPSIS FLOW TEST PASSED" /tmp/apoapsis-flow.log

      - name: Render regression screenshots
        run: |
          set -o pipefail
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1             /home/runner/.local/share/godot/godot_executable/Godot_v4.5.1-stable_linux.x86_64             --path .             --rendering-method gl_compatibility             --script res://tests/render_capture.gd             2>&1 | tee /tmp/apoapsis-render.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid access|Invalid call|prepare_camera" /tmp/apoapsis-render.log; then
            echo "Render regression test detected Godot errors."
            exit 1
          fi
          grep -q "APOAPSIS RENDER CAPTURE PASSED" /tmp/apoapsis-render.log

      - name: Upload render captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APOAPSIS-Render-Captures
          path: test-output/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: APOAPSIS-Windows
          path: /home/runner/.local/share/godot/archives/*.zip
          if-no-files-found: error
          retention-days: 14
